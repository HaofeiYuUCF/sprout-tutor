<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPROUT Camera Test</title>
<link rel="stylesheet" href="/weblab/static/weblab.css">
<style>
  .cam { display: flex; flex-direction: column; gap: 12px; max-width: 1100px; }
  video, .shot img { width: 100%; border-radius: 8px; background: #000; }
  .shot { overflow: auto; max-height: 70vh; border-radius: 8px; border: 1px solid var(--line); }
  .shot img { width: auto; max-width: none; display: block; }
</style>
</head>
<body>
<header class="bar"><div class="brand">SPROUT <span>Camera test</span></div></header>
<main class="cam">
  <p>Point the camera straight down at the UNO and breadboard, then take a photo. The photo is
    saved on this computer in <code>data/photos/</code> and shown below at full size, so you can
    check whether every leg and hole is readable.</p>
  <div class="actions">
    <select id="device" aria-label="Camera"></select>
    <button id="shoot" class="primary big" disabled>Take photo</button>
    <span id="info" class="muted"></span>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <div id="result" class="muted"></div>
  <div class="shot" hidden><img id="img" alt="Last photo at full size"></div>
</main>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  let stream = null;

  async function open(deviceId) {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: {
      deviceId: deviceId ? { exact: deviceId } : undefined,
      width: { ideal: 3840 }, height: { ideal: 2160 } } });   // the camera picks its best size
    $("video").srcObject = stream;
    const s = stream.getVideoTracks()[0].getSettings();
    $("info").textContent = `${s.width} × ${s.height}`;
    $("shoot").disabled = false;
    return s.deviceId;
  }

  try {
    const current = await open();
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    $("device").replaceChildren(...cams.map((d, i) => {
      const o = document.createElement("option");
      o.value = d.deviceId;
      o.textContent = d.label || `Camera ${i + 1}`;
      o.selected = d.deviceId === current;
      return o;
    }));
    $("device").addEventListener("change", (e) => open(e.target.value));
  } catch (e) {
    $("result").textContent = `No camera available: ${e.message}`;
  }

  $("shoot").addEventListener("click", async () => {
    const v = $("video");
    const c = document.createElement("canvas");
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const image = c.toDataURL("image/jpeg", 0.92);
    $("img").src = image;
    document.querySelector(".shot").hidden = false;
    try {
      const r = await fetch("/api/weblab/photo", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image }) });
      const j = await r.json();
      $("result").textContent = r.ok ? `Saved ${j.saved} (${c.width} × ${c.height}, ${Math.round(j.bytes / 1024)} kB)`
        : `Not saved: ${j.error}`;
    } catch (e) {
      $("result").textContent = `Not saved: ${e.message}`;
    }
  });
})();
</script>
</body>
</html>
