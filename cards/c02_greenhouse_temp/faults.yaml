schema_version: 1
card_id: c02_greenhouse_temp
# Hints: [1 where, 2 general check, 3 specific issue, 4 fix]. Step 4 never pastes a full sketch.
faults:
  - id: sensor_reversed
    class: wiring
    title: TMP36 power and ground swapped
    safety_critical: true
    evidence:
      student_keywords: [hot, burning, burnt, "too warm to touch"]
      photo_finding: tmp36_reversed
    hints:
      - Unplug the USB cable now. A sensor that gets hot usually has power and ground swapped.
      - With the flat face toward you, the TMP36 legs are 5V, signal, GND from left to right.
      - The left and right legs are reversed in your circuit.
      - With USB unplugged, swap the 5V and GND wires on the outer legs, let it cool, then plug back in.

  - id: integer_division
    class: logic
    title: Integer division in the voltage conversion
    evidence:
      code_regex: "\\(\\s*5\\s*/\\s*1023\\s*\\)"
      serial_regex: "temp_c=-50\\.0"
    seed: integer_division
    hints:
      - Every reading is exactly -50.0, even when you pinch the sensor. That points to the calculation, not the wiring.
      - Look at how volts is computed. Work it out by hand for raw = 150. Do you get about 0.73?
      - In C++, 5 / 1023 uses whole numbers and evaluates to 0, so volts is always 0.
      - Write the numbers as decimals (5.0 / 1023.0) so the division keeps its fraction.

  - id: wrong_analog_pin
    class: logic
    title: Code reads a different pin than the one wired
    evidence:
      code_regex: "TEMP_PIN\\s*=\\s*A[1-5]\\b|analogRead\\s*\\(\\s*A[1-5]\\s*\\)"
    seed: wrong_analog_pin
    hints:
      - The readings do not respond when you pinch the sensor. Compare your code with your wiring.
      - Check which analog pin the sensor's middle leg goes to, and which pin your code reads.
      - Your code reads a different analog pin from the one the sensor is wired to.
      - Make the pin in your code match the wire (A0 in the card), or move the wire to match the code.

  - id: signal_unconnected
    class: wiring
    title: Signal leg not connected to A0
    evidence:
      serial_out_of_range: {field: temp_c, min: -10, max: 60}
      photo_finding: tmp36_signal_open
      student_keywords: [random, jumping, "crazy numbers", "weird numbers"]
    hints:
      - The numbers are impossible for a room (or jump around). The code runs; check the circuit.
      - Follow the middle leg of the sensor. Is it in the same breadboard row as the wire to A0?
      - The sensor's signal leg is not reaching A0, so the pin floats and reads noise or zero.
      - Put the wire from A0 in the same row as the TMP36's middle leg and press it in firmly.

  - id: missing_print
    class: serial
    title: Nothing printed
    evidence:
      code_missing_regex: "Serial\\.print"
      student_keywords: ["nothing in serial", "serial is empty", "no output"]
    hints:
      - If nothing prints, you cannot see the reading. Start with the code.
      - Check that setup() starts serial at 9600 and loop() prints the value each time.
      - loop() reads the sensor but never prints the result.
      - "Print the reading in loop() in the form raw=<value> temp_c=<value>, one line per reading."
