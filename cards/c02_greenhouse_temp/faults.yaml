schema_version: 1
card_id: c02_greenhouse_temp
# Hints: [1 where, 2 general check, 3 specific issue, 4 fix]. Step 4 never pastes a full sketch.
faults:
  - id: integer_division
    class: logic
    title: Integer division in the resistance formula
    evidence:
      code_regex: "1023\\s*/\\s*raw"
      context_serial_regex: "temp_c=-273\\.1"
    seed: integer_division
    hints:
      - Look at the calculation in your code before the wiring. A reading of -273.1 (colder than anything can be) is the typical sign.
      - Look at how r is computed. Work it out by hand for raw = 512. Do you get about 10000?
      - In C++, 1023 / raw uses whole numbers, so 1023 / 512 gives 1 and r becomes 0.
      - Write 1023 as a decimal (1023.0) so the division keeps its fraction.

  - id: wrong_analog_pin
    class: logic
    title: Code reads a different pin than the one wired
    evidence:
      code_regex: "TEMP_PIN\\s*=\\s*A[1-5]\\b|analogRead\\s*\\(\\s*A[1-5]\\s*\\)"
    seed: wrong_analog_pin
    hints:
      - Compare your code with your wiring. If the reading does not change when you pinch the thermistor, a pin mismatch is a common cause.
      - Check which analog pin the middle column of your divider goes to, and which pin your code reads.
      - Your code reads a different analog pin from the one the divider is wired to.
      - Make the pin in your code match the wire (A0 in the card), or move the wire to match the code.

  - id: divider_resistor_missing
    class: wiring
    title: 10k resistor missing from the divider
    evidence:
      serial_regex: "\\braw=102[0-3]\\b"
      photo_finding: divider_resistor_missing
    hints:
      - The reading is stuck at the top (raw=1023), so the code runs but the circuit is incomplete. Check the circuit.
      - A thermistor alone cannot make a voltage that changes. It needs a partner resistor from A0 to GND.
      - The 10k resistor between the A0 column and GND is missing or not connected.
      - Put the 10k resistor from the column with the thermistor and the A0 wire to GND.

  - id: signal_unconnected
    class: wiring
    title: Divider not reaching A0
    evidence:
      serial_out_of_range: {field: temp_c, min: -10, max: 60}
      serial_regex: "\\braw=0\\b"
      photo_finding: divider_signal_open
      student_keywords: [random, jumping, "crazy numbers", "weird numbers"]
    hints:
      - If the numbers are impossible for a room, stuck at raw=0, or jumping around, the code is running but the signal is not reaching the board. Check the circuit.
      - Follow the wire from A0. Is it in the same column as the thermistor leg and the 10k resistor leg?
      - The middle point of the divider is not reaching A0, or the thermistor is not connected to 5V.
      - Put the A0 wire in the column shared by the thermistor and the 10k resistor, and connect the thermistor's other leg to 5V.

  - id: divider_swapped
    class: wiring
    title: Thermistor and resistor swapped
    evidence:
      student_keywords: ["goes down", "drops", "decreases", "gets lower", "backwards", "colder when"]
      photo_finding: divider_swapped
    hints:
      - If the temperature goes down when you warm the thermistor, the code is fine. The order of the parts in the circuit is the usual cause.
      - In the card's divider the thermistor sits between 5V and A0, and the 10k resistor between A0 and GND.
      - Your thermistor and 10k resistor have swapped places, so the voltage moves the wrong way.
      - Swap the two parts so the thermistor connects to 5V and the 10k resistor connects to GND.

  - id: missing_print
    class: serial
    title: Nothing printed
    evidence:
      code_missing_regex: "Serial\\.print"
      student_keywords: ["nothing in serial", "serial is empty", "no output", "no messages"]
    hints:
      - If nothing prints, you cannot see the reading. Start with the code.
      - Check that setup() starts serial at 9600 and loop() prints the value each time.
      - loop() reads the sensor but never prints the result.
      - "Print the reading in loop() in the form raw=<value> temp_c=<value>, one line per reading."
