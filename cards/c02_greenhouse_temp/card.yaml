schema_version: 2
id: c02_greenhouse_temp
title: Read greenhouse temperature
version: 3
stage: seed
learning_objectives:
  - Read an analog sensor with analogRead.
  - Build a voltage divider and convert its reading to resistance, then to degrees Celsius.
  - Judge whether a reading is plausible and how it responds to warming.
agriculture_connection: >-
  Greenhouse fans, vents and shade cloths are switched on temperature. Many crops slow down above
  about 30 °C, so growers watch temperature closely. This card measures it with a thermistor, a
  part whose resistance drops as it warms. The next cards act on the reading.
parts:
  - {name: Arduino UNO R3 (or compatible), qty: 1}
  - {name: Breadboard, qty: 1}
  - {name: Thermistor (10k NTC), qty: 1}
  - {name: 10k ohm resistor, qty: 1}
  - {name: Jumper wire, qty: 3}
  - {name: USB cable, qty: 1}
safety:
  - Low-voltage DC only (5 V from USB).
tinkercad:
  note: Optional extra. Tinkercad Circuits has a TMP36 temperature sensor but no thermistor, so use the SPROUT simulator for this card.
steps:
  - id: simulate
    kind: simulate
    text: >-
      Wire the thermistor and the 10k resistor in the simulator, then press "Test my wiring". Move
      the temperature slider and watch the reading change in the messages from the board.
  - id: build
    kind: build
    text: >-
      Build the divider on your breadboard: 5 V (red wire) to one thermistor leg; the other
      thermistor leg and one 10k resistor leg share a column with a wire to A0; the other 10k leg
      goes to GND (black wire). The thermistor has no plus or minus side.
  - id: code
    kind: code
    text: >-
      In loop(), read A0. Turn the reading into the thermistor's resistance, then into °C, using
      the two formulas in the starter's TODO lines. Print a line like "raw=512 temp_c=25.0" once a
      second.
  - id: run
    kind: run
    text: >-
      Send your code to the board and watch the messages. Room temperature should read about
      20–26 °C. Pinch the thermistor between your fingers and the reading should rise.
  - id: reflect
    kind: reflect
    text: >-
      Your reading jumps by a few tenths of a degree. How would you decide whether a 0.5 °C
      change is real? What reference could you compare against?
