schema_version: 1
id: c01_pump_light
title: Pump status light
version: 1
stage: seed
learning_objectives:
  - Configure a digital pin as an output with pinMode.
  - Switch an LED on and off with digitalWrite and delay.
  - Upload a sketch and confirm it runs by reading the Serial Monitor.
agriculture_connection: >-
  Irrigation controllers show when a pump or valve is running. In this card the LED stands
  in for the pump-on light. In a later card, the same pin drives a relay that switches a
  small low-voltage pump.
parts:
  - {name: Arduino UNO R3 (or compatible), qty: 1}
  - {name: Breadboard, qty: 1}
  - {name: Red LED, qty: 1}
  - {name: 220 ohm resistor, qty: 1}
  - {name: Jumper wire, qty: 2}
  - {name: USB cable, qty: 1}
safety:
  - Low-voltage DC only (5 V from USB). Never connect anything to mains power.
  - Always put a resistor in series with an LED.
tinkercad:
  note: >-
    In Tinkercad Circuits, place an Arduino Uno R3, a breadboard, an LED and a 220 ohm
    resistor. Wire pin 8 to the resistor, the resistor to the LED's long leg (anode), and the
    LED's short leg (cathode) to GND. Run the simulation, then save a share link.
steps:
  - id: simulate
    kind: simulate
    text: Build and run the circuit in Tinkercad first. Paste your share link when it blinks.
  - id: build
    kind: build
    text: >-
      Build the same circuit on your breadboard. Red wire for 5 V, black for GND. Pin 8 goes
      to the resistor; the resistor goes to the LED's long leg; the short leg goes to GND.
  - id: code
    kind: code
    text: >-
      Open the starter sketch. Set pin 8 as an output in setup(). In loop(), turn the LED on,
      print "PUMP ON", wait one second, turn it off, print "PUMP OFF", wait one second.
  - id: run
    kind: run
    text: Compile and upload. The LED should blink and the serial log should alternate PUMP ON / PUMP OFF.
  - id: reflect
    kind: reflect
    text: >-
      A real pump should not switch every second. What would make a sensible on/off rhythm
      for watering a pot of tomatoes, and what information would you need to decide?
