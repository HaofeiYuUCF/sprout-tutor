schema_version: 2
id: c01_light_led
title: Light an LED
version: 2
stage: seed
learning_objectives:
  - Explain that current only flows around a closed loop, from 5V through the parts back to GND.
  - Use a breadboard, an LED and a resistor correctly (LED direction, why the resistor is there).
  - Switch a pin HIGH and LOW from code, and read the board's messages.
agriculture_connection: >-
  Every greenhouse controller has status lights that tell the grower at a glance what is running:
  the fan, the irrigation valve, the heater. This card builds one status light. First it lights
  with no code at all, then your program switches it on and off.
parts:
  - {name: Arduino UNO R3 (or compatible), qty: 1}
  - {name: Breadboard, qty: 1}
  - {name: Red LED, qty: 1}
  - {name: 220 ohm resistor, qty: 1}
  - {name: Jumper wire, qty: 3}
  - {name: USB cable, qty: 1}
safety:
  - Unplug the USB cable before you add, move or remove any part or wire.
  - Low-voltage DC only (5 V from USB). Never connect anything to mains power.
  - Always put a resistor in the same path as an LED (in series). It keeps the current small.
tinkercad:
  note: Optional extra. Tinkercad Circuits can also build this circuit (LED and 220 ohm resistor).
steps:
  - id: simulate
    kind: simulate
    text: |-
      Part A: light the LED with no code.
      1. Drag the 220 Ω resistor and the LED onto the breadboard.
      2. Add a wire from 5V to one end of the resistor.
      3. Connect the other end of the resistor to the LED's long leg (+).
      4. Add a wire from the LED's short leg to GND. The LED lights.
      5. Try three changes, one at a time, and read the wiring tips after each: turn the LED around, take the resistor out, remove one wire. Undo each change before the next.
      Part B: let a pin switch the LED.
      6. Move the wire from 5V to pin 9.
      7. Press "Test my wiring". The LED should blink.
  - id: build
    kind: build
    text: >-
      Build the Part B circuit on your breadboard: pin 9 to the 220 Ω resistor, the resistor to the
      LED's long leg, the LED's short leg to GND (black wire).
  - id: code
    kind: code
    text: >-
      In setup(), make pin 9 an output. In loop(), turn the LED on, print "LED ON", wait one
      second, turn it off, print "LED OFF", and wait one second.
  - id: run
    kind: run
    text: >-
      Send your code to the board. The LED should blink once a second, and the messages from the
      board should switch between LED ON and LED OFF.
  - id: reflect
    kind: reflect
    text: >-
      Suppose your LED stays dark. How could you tell whether the problem is in the wiring or in
      the code? Which clues on the screen would you look at first?
