schema_version: 2
id: c03_vent_fan
title: Greenhouse ventilation fan
version: 2
stage: seed
learning_objectives:
  - Explain why a motor needs a transistor instead of a direct pin connection.
  - Wire an NPN transistor as a switch and protect it with a diode.
  - Reuse working code to drive a new load.
agriculture_connection: >-
  Greenhouses overheat quickly on sunny days, so growers run vent fans to push the hot air out.
  In this card your blink code from card 1 switches a small fan instead of an LED. A transistor
  does the heavy lifting, the same idea real controllers use to switch big fans through relays.
parts:
  - {name: Arduino UNO R3 (or compatible), qty: 1}
  - {name: Breadboard, qty: 1}
  - {name: 1k ohm resistor, qty: 1}
  - {name: NPN transistor (PN2222), qty: 1}
  - {name: Diode (1N4007), qty: 1}
  - {name: DC motor with fan blade, qty: 1}
  - {name: Jumper wire, qty: 5}
  - {name: USB cable, qty: 1}
safety:
  - Unplug the USB cable before you add, move or remove any part or wire.
  - Low-voltage DC only (5 V from USB). Never connect anything to mains power.
  - Never connect the motor straight to a pin. Always switch it through the transistor.
  - Keep fingers and hair away from the spinning fan blade.
tinkercad:
  note: Optional extra. Use the SPROUT simulator for this card.
steps:
  - id: simulate
    kind: simulate
    text: >-
      Wire the fan in the simulator: pin 9 to the 1k resistor to the transistor's middle leg (B);
      the left leg (E) to GND; the right leg (C) to one motor lead; the other motor lead to 5V;
      the diode across the motor with its stripe on the 5V side. Press "Test my wiring".
  - id: build
    kind: build
    text: >-
      Build the fan circuit on your breadboard. PN2222A flat face toward you: left leg (emitter) to
      GND, middle leg (base) through the 1k resistor to pin 9, right leg (collector) to one motor
      lead. The other motor lead goes to 5 V. Put the diode across the two motor leads, stripe
      toward 5 V.
  - id: code
    kind: code
    text: >-
      This is your card 1 blink program with a new name for the pin. Make pin 9 an output, then
      turn the fan on, print "FAN ON", wait three seconds, turn it off, print "FAN OFF", and wait.
  - id: run
    kind: run
    text: >-
      Send your code to the board. The fan should run for three seconds and stop for three
      seconds, and the messages from the board should switch between FAN ON and FAN OFF.
  - id: reflect
    kind: reflect
    text: >-
      An UNO pin can only give a tiny current, yet the fan runs. What job does the transistor do?
      Why do real greenhouse controllers switch big fans through relays instead of directly?
