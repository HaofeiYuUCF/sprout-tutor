schema_version: 1
card_id: c04_heat_alarm
# Hints: [1 where, 2 general check, 3 specific issue, 4 fix]. Step 4 never pastes a full sketch.
faults:
  - id: threshold_inverted
    class: logic
    title: Comparison reversed
    evidence:
      code_regex: "tempC\\s*<=?\\s*ALARM_C|ALARM_C\\s*>=?\\s*tempC"
      serial_regex: "temp_c=2[0-6]\\.\\d alarm=ON"
    seed: threshold_inverted
    hints:
      - Look at the decision in your code. If the alarm comes on at room temperature, the comparison is the usual cause, not the wiring.
      - Read your if-condition out loud as a sentence. Does it say "too hot"?
      - The comparison is reversed, so the alarm turns on when it is cooler than the threshold.
      - Change the comparison so the alarm is on only when tempC is greater than ALARM_C.

  - id: alarm_never_on
    class: logic
    title: Alarm never turns on during testing
    evidence:
      student_keywords: ["never turns on", "never on", "always off", "stays off", "never beeps"]
      context_serial_regex: "alarm=OFF"
      requires_context: true   # only when the log really shows alarm=OFF
    hints:
      - The messages show alarm=OFF, so the code runs. The question is whether the reading ever crosses the threshold.
      - Watch temp_c while you pinch the thermistor. How high does it get, compared with ALARM_C?
      - A finger warms the thermistor only to about 28–32 °C, so the threshold may never be crossed.
      - For testing, set ALARM_C one or two degrees above your room reading, confirm the buzzer switches, then set it back.

  - id: buzzer_silent
    class: wiring
    title: Buzzer silent although the alarm is on
    evidence:
      context_serial_regex: "alarm=ON"
      student_keywords: ["no sound", "silent", "doesn't beep", "does not beep", "no beep", "can't hear"]
      photo_finding: buzzer_reversed_or_wrong_pin
    hints:
      - If the messages say alarm=ON but you hear nothing, the code decided correctly. Check the buzzer circuit.
      - Which pin does the buzzer's long leg go to, and which pin does BUZZER_PIN name? Where does the short leg go?
      - The buzzer only sounds with its long leg (+) on the pin side and its short leg on GND, on the pin the code switches.
      - Put the buzzer's long leg in the column wired to pin 8 and its short leg in a column wired to GND.

  - id: signal_unconnected
    class: wiring
    title: Divider not reaching A0
    evidence:
      serial_out_of_range: {field: temp_c, min: -10, max: 60}
      serial_regex: "temp_c=-273\\.1"
      photo_finding: divider_signal_open
    hints:
      - If the temperature values are impossible for a room (for example -273.1), check the sensor circuit before the code.
      - Follow the wire from A0. Is it in the same column as the thermistor leg and the 10k resistor leg?
      - The middle point of the divider is not reaching A0, or one of its parts is not connected.
      - Rebuild the divider from card 2 (5V, thermistor, A0 column, 10k resistor, GND) and press the parts in firmly.

  - id: buzzer_pin_not_output
    class: logic
    title: Buzzer pin not configured
    evidence:
      code_missing_regex: "pinMode\\s*\\(\\s*BUZZER_PIN"
      student_keywords: [quiet, faint, "very soft"]
    hints:
      - This looks like a code issue in how the buzzer pin is set up, not the wiring.
      - Every pin you drive must be told what job it has before loop() starts. Check setup().
      - setup() never configures the buzzer pin as an output, so it only gets a weak trickle of current.
      - "In setup(), add a line that sets BUZZER_PIN to OUTPUT using pinMode."
