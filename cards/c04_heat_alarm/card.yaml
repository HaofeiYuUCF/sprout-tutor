schema_version: 2
id: c04_heat_alarm
title: Greenhouse heat alarm
version: 5
stage: seed
learning_objectives:
  - Compare a reading with a threshold using if and else.
  - Switch an output (the buzzer) based on a sensor reading.
  - Choose a threshold you can test, and test it.
agriculture_connection: >-
  Growers need to know when a greenhouse gets dangerously hot, for example when a vent fails on a
  sunny afternoon. This card sounds an alarm above a temperature you choose.
parts:
  - {name: Arduino UNO R3 (or compatible), qty: 1}
  - {name: Breadboard, qty: 1}
  - {name: Thermistor (10k NTC), qty: 1}
  - {name: 10k ohm resistor, qty: 1}
  - {name: Active buzzer, qty: 1}
  - {name: Jumper wire, qty: 5}
  - {name: USB cable, qty: 1}
safety:
  - Unplug the USB cable before you add, move or remove any part or wire.
  - Low-voltage DC only (5 V from USB).
tinkercad:
  note: Optional extra. Tinkercad Circuits has no thermistor, so use the SPROUT simulator for this card.
steps:
  - id: simulate
    kind: simulate
    text: >-
      Wire the thermistor divider and the buzzer (long leg + to pin 8, short leg to GND) in the
      simulator, then press "Test my wiring". The buzzer should beep and the sensor should report
      a temperature.
  - id: build
    kind: build
    text: >-
      Build it on the breadboard: the thermistor divider from card 2 on A0, and the active buzzer
      with its long leg (+) to pin 8 and its short leg to GND. Keep the two circuits in separate
      columns.
  - id: code
    kind: code
    text: >-
      Set the buzzer pin as an output. If tempC is above ALARM_C, turn the buzzer on; otherwise
      turn it off. Print a line like "temp_c=24.8 alarm=OFF" for each reading.
  - id: run
    kind: run
    text: >-
      Send your code to the board. At room temperature the alarm should be OFF. Pinch the
      thermistor until it passes 28 °C, listen for the buzzer, and watch the messages switch to ON.
      If your fingers cannot warm it that far, set ALARM_C a little above the room reading for the
      test, then put it back.
  - id: reflect
    kind: reflect
    text: >-
      If the temperature hovers right at the threshold, the alarm will switch on and off again and
      again. Real controllers avoid this. How could you change the rule so it does not chatter?
