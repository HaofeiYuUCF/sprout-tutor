schema_version: 1

board:
  mode: fake              # fake (no hardware) | real (arduino-cli + USB board)
  fqbn: arduino:avr:uno
  serial_port: auto       # auto = detect by USB VID/PID; or e.g. COM5 (env SPROUT_SERIAL_PORT overrides)
  baud: 9600
  arduino_cli: tools/arduino-cli/arduino-cli.exe
  arduino_cli_config: tools/arduino-cli.yaml   # generated by scripts/setup_arduino_cli.ps1

llm:
  provider: mock          # mock | anthropic (env SPROUT_LLM_PROVIDER overrides)
  model: claude-opus-5-5
  effort: low             # low | medium | high
  max_tokens: 2000
  use_cache: true         # cache responses on disk so evaluation reruns are free and reproducible

ui:
  port: 8080              # env SPROUT_UI_PORT overrides

paths:
  data_dir: data          # git-ignored: work/, events/, learners/, photos/, cache/
